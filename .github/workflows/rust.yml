name: Rust migration
on:
  push:
    branches: ['migration/native-rust']
  pull_request:
    paths: ['rust/**', 'Cargo.*', 'scripts/build-rust.ps1', 'installer/Svyaz.iss', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Rust tests on Windows
        run: cargo test --workspace --locked --release --target x86_64-pc-windows-msvc
      - name: Install Inno Setup compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/jrsoftware/issrc/releases/tags/is-6_7_3 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch Inno Setup release' }
          $asset = $release.assets | Where-Object name -eq 'innosetup-6.7.3.exe'
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download Inno Setup' }
          $file = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -ne "sha256:$hash") { throw 'Inno Setup checksum mismatch' }
          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') { throw 'Inno Setup publisher not verified' }
          $process = Start-Process $file -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$env:RUNNER_TEMP/InnoSetup`"") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Cannot install Inno Setup' }
      - name: Build native application and installer
        shell: pwsh
        run: ./scripts/build-rust.ps1 -IsccPath "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
      - name: Update a real 0.13.3 installation and test rollback
        shell: pwsh
        run: |
          $installer = (Get-Item dist/Svyaz-*-win-x64-setup-unsigned.exe).FullName
          ./rust/windows-integration/check-migration.ps1 -NativeInstaller $installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rust-Windows-candidate
          path: |
            dist/Svyaz-*.zip*
            dist/Svyaz-*-setup-*.exe*
            dist/rust-*.log
            dist/rust-*.png
