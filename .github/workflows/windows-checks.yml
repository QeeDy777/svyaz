name: Windows checks
on:
  push:
    branches: [main, feature/telegram-proxy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Core checks
        run: dotnet run --project tests/DiscordRoute.Checks
      - name: Download official Telegram fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist/telegram-component | Out-Null
          gh api repos/Flowseal/tg-ws-proxy/releases/latest > dist/telegram-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch Telegram release metadata' }
          $release = Get-Content dist/telegram-release.json -Raw | ConvertFrom-Json
          gh release download $release.tag_name --repo Flowseal/tg-ws-proxy --pattern TgWsProxy_windows.exe --dir dist/telegram-component
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download official Telegram EXE' }
      - name: WPF and real Telegram process
        run: dotnet run --project tests/DiscordRoute.WindowsChecks -- dist/telegram-release.json dist/telegram-component/TgWsProxy_windows.exe
      - name: Build portable archive
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: |
            dist/telegram-window.png
            dist/Svyaz-*.zip*
