name: Windows checks
on:
  push:
    branches: [main, feature/first-full-selection]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Core checks
        run: dotnet run --project tests/DiscordRoute.Checks
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build and test embedded Telegram runtime
        shell: pwsh
        run: |
          python scripts/prepare-telegram.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime build failed' }
          Expand-Archive dist/telegram-runtime.zip dist/telegram-test-runtime
          $env:PYTHONPATH = "$pwd/dist/telegram-test-runtime"
          python tests/telegram_embed_checks.py
          if ($LASTEXITCODE -ne 0) { throw 'Embedded engine tests failed' }
          python tests/telegram_embed_checks.py --stress
          if ($LASTEXITCODE -ne 0) { throw 'Embedded engine stress checks failed' }
      - name: Build portable archive
        shell: pwsh
        run: ./build.ps1
      - name: Install Inno Setup compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/jrsoftware/issrc/releases/tags/is-6_7_3 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch Inno Setup release' }
          $asset = $release.assets | Where-Object name -eq 'innosetup-6.7.3.exe'
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download Inno Setup' }
          $file = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -ne "sha256:$hash") { throw 'Inno Setup checksum mismatch' }
          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') { throw 'Inno Setup publisher not verified' }
          $process = Start-Process $file -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$env:RUNNER_TEMP/InnoSetup`"") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Cannot install Inno Setup' }
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -IsccPath "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
      - name: Download previous version for rollback test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/QeeDy777/svyaz/releases/tags/v0.6.1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch previous release' }
          $asset = $release.assets | Where-Object name -eq 'Svyaz-0.6.1-win-x64-unsigned.zip'
          New-Item -ItemType Directory -Force dist/rollback-fixture | Out-Null
          gh release download v0.6.1 --repo QeeDy777/svyaz --pattern Svyaz-0.6.1-win-x64-unsigned.zip --dir dist/rollback-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download rollback fixture' }
          $hash = (Get-FileHash dist/rollback-fixture/Svyaz-0.6.1-win-x64-unsigned.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -ne "sha256:$hash") { throw 'Rollback fixture checksum mismatch' }
      - name: WPF, Telegram and self-update
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          dotnet run --project tests/DiscordRoute.WindowsChecks -- "dist/Svyaz-$version-win-x64-unsigned.zip" dist/rollback-fixture/Svyaz-0.6.1-win-x64-unsigned.zip
      - name: Installer lifecycle
        shell: pwsh
        run: ./tests/Installer.Checks.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: |
            dist/*-window.png
            dist/Svyaz-*.zip*
            dist/Svyaz-*-setup-*.exe*
            dist/installer-*.log
            dist/installer-shortcut.lnk
