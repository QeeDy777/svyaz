name: Windows checks
on:
  push:
    branches: [main, feature/telegram-proxy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Core checks
        run: dotnet run --project tests/DiscordRoute.Checks
      - name: WPF and real Telegram process
        run: dotnet run --project tests/DiscordRoute.WindowsChecks
      - name: Build portable archive
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: |
            dist/telegram-window.png
            dist/Svyaz-*.zip*
