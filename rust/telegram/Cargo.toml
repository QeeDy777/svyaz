[package]
name = "svyaz-telegram"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes = "0.8"
ctr = "0.9"
bytes = "1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
hmac = "0.12"
indexmap = "2"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls-alpn", "http2"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
svyaz-settings = { path = "../settings" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tokio-native-tls = "0.3"
tokio-tungstenite = {version = "0.28", features = ["native-tls"] }
x25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Networking_WinSock"] }

[dev-dependencies]
h2 = "0.4"
http = "1"
