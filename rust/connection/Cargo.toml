[package]
name = "svyaz-connection"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "native-tls"] }
chrono = "0.4"
sha2 = "0.10"
regex = "1"
svyaz-settings = { path = "../settings" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_Networking_NetworkListManager"] }
