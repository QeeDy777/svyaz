[package]
name = "svyaz"
version = "0.14.1"
edition = "2024"
publish = false

[dependencies]
svyaz-settings = { path = "../settings" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
wgpu = {version="24",default-features=false,features=["dx12","wgsl"]}
image = {version="0.25", default-features=false, features=["png"]}
svyaz-connection = {path="../connection"}
svyaz-packages = {path="../packages"}
svyaz-update = {path="../update"}
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Graphics_Gdi","Win32_Media_Audio","Win32_Security","Win32_NetworkManagement_IpHelper","Win32_NetworkManagement_Ndis","Win32_System_Diagnostics_ToolHelp","Win32_System_JobObjects","Win32_System_Services","Win32_System_Threading","Win32_UI_Shell","Win32_System_Com","Win32_System_LibraryLoader","Win32_UI_WindowsAndMessaging","Win32_UI_HiDpi"]}
svyaz-telegram = { path = "../telegram" }
svyaz-windows = { path = "../windows-integration" }
raw-window-handle = "0.6"
tray-icon = "0.20"
rfd = {version="0.15", default-features=false}
winreg = "0.55"
chrono = {version="0.4",default-features=false,features=["clock"]}

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
