[package]
name = "svyaz-windows"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
svyaz-update = { path = "../update" }

[target.'cfg(windows)'.dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Com", "Win32_System_Threading", "Win32_System_TaskScheduler", "Win32_System_Ole",
    "Win32_System_Variant", "Win32_System_SystemInformation", "Win32_System_JobObjects",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging" ] }

[target.'cfg(windows)'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Threading",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging" ] }
